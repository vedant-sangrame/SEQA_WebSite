services:
  - type: web
    name: sprintsync-retro-board
    env: node
    region: oregon
    plan: free
    # Vite is a devDependency, so install it explicitly even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SITE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Recommended for the free Render plan: Resend sends through HTTPS (port 443),
      # while free Render services cannot connect to SMTP ports.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
